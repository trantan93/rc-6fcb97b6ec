<head>
<meta charset="utf-8">

<title>Mục 2 · Báo cáo bán hàng động</title>
<style>
:root{--bg:#efeae2;--ink:#1c1915;--muted:#5e584f;--line:#ddd6cb;--white:#fffcf8;--good:#0f5c38;--good-bg:#e5f4ec;--bad:#8d2b24;--bad-bg:#f8e8e6;--c1:#1e3a5f;--c2:#c2571a;--c3:#5b8fc7;--c4:#e8a33d}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans","Liberation Sans",sans-serif;font-size:15px;line-height:1.45}
main{width:100%;margin:0 auto;padding:28px 36px 72px;max-width:1440px}
.kicker{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:"Noto Serif","Liberation Serif",serif;font-size:36px;line-height:1.1}
h2{font-family:"Noto Serif","Liberation Serif",serif;font-size:22px;margin:28px 0 10px}
.muted{color:var(--muted)}.small{font-size:12.5px}
header{padding-bottom:16px;border-bottom:2px solid var(--ink)}
.filters{margin-top:16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.f{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.f>label,.f>.lab{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
select,input[type=date],button{font:inherit;font-size:14px}
select,input[type=date]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.ms{position:relative}
.ms>button{width:100%;text-align:left;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms .pop{display:none;position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:6px;max-height:340px;overflow:auto;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.ms.open .pop{display:block}
.pop label{display:flex;gap:8px;align-items:center;padding:4px 4px;font-size:14px;cursor:pointer}
.pop .grp{font-size:12px;font-weight:700;color:var(--muted);margin:6px 4px 2px}
.pop .acts{display:flex;gap:6px;margin-bottom:4px}.pop .acts button{font-size:12px;padding:2px 8px;border:1px solid var(--line);background:var(--bg);border-radius:4px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;cursor:pointer}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.cmpline{font-size:12.5px;color:var(--muted);margin-top:6px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}
.card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.card .t{font-size:13px;font-weight:700;color:var(--muted)}
.card .value{font-size:28px;font-weight:700;margin:4px 0;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .compare{font-size:13px}
.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--muted)}
.card .detail{font-size:12px;color:var(--muted);margin-top:4px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:12px}
.row-ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row-ctl .f{padding:0;border:0;background:none;min-width:180px}
.table-scroll{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;background:var(--white)}
th{background:#f5f0e8;font-size:12.5px;position:sticky;top:0}
th:first-child,td:first-child{position:sticky;left:0;text-align:left;z-index:1;border-right:1px solid var(--line)}
th:first-child{z-index:2}
tr.l1 td{font-weight:700;background:#f7f3ec}
tr.l2 td:first-child{padding-left:26px}
tr.total td{font-weight:700;border-top:2px solid var(--ink);background:#efe8dc}
.chart-wrap{margin-top:10px;overflow-x:auto}
svg text{font-size:12px;fill:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hint{padding:40px 10px;text-align:center;color:var(--muted)}
.clusters{display:none;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.clusters.on{display:grid}
.notes{font-size:12.5px;color:var(--muted)}.notes li{margin:3px 0}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media (max-width:900px){.filters{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){main{padding:16px 12px 48px}h1{font-size:26px}.filters{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr;gap:8px}
 .card{padding:10px}.card .value{font-size:20px}.clusters.on{grid-template-columns:1fr}.row-ctl .f{min-width:0;flex:1 1 140px}}
</style>
</head>

const DAY = 86400000, ORIGIN = Date.UTC(...P.origin.split('-').map((x,i)=>i==1?x-1:+x));
const LAST = P.lastDay; // day index of latest data day
const GROUPS = [['ADI','adidas'],['SP','Sportpro'],['PUMA','PUMA']];
const GNAME = Object.fromEntries(GROUPS);
const M = [
 {k:'net',l:'Doanh số',kind:'add',unit:'đ'},
 {k:'bills',l:'Số bill',kind:'add'},
 {k:'atv',l:'ATV',kind:'ratio',unit:'đ'},
 {k:'upt',l:'UPT',kind:'ratio',dec:2},
 {k:'ckr',l:'Tỷ lệ CK',kind:'rate'},
 {k:'traffic',l:'Traffic',kind:'add'},
 {k:'cr',l:'CR',kind:'rate'},
 {k:'top',l:'Tỷ trọng Top',kind:'rate'},

];
const MK = Object.fromEntries(M.map(m=>[m.k,m]));

// ---------- index data ----------
const nS = S.length, nD = LAST+1;
const F = ['net','gross','ck','units','top','shoes','mapped','fullp','bills'];
const cube = F.map(()=>new Float64Array(nS*nD));
for (const r of P.daily){ const o=r[0]*nD+r[1]; for(let i=0;i<F.length;i++) cube[i][o]+=r[2+i]; }
const traf = new Float64Array(nS*nD), hasT = new Uint8Array(nS*nD);
for (const [s,d,v] of P.traffic){ if(d<=LAST){ traf[s*nD+d]+=v; hasT[s*nD+d]=1; } }
const stockDays = P.stockDays; const stockV = P.stockVals; // stockV[j][s]
// ---------- helpers ----------
const iso = d => new Date(ORIGIN+d*DAY).toISOString().slice(0,10);
const dmy = d => { const [y,m,dd]=iso(d).split('-'); return `${dd}/${m}/${y}`; };
const dm = d => { const [y,m,dd]=iso(d).split('-'); return `${dd}/${m}`; };
const fromIso = s => Math.round((Date.parse(s+'T00:00:00Z')-ORIGIN)/DAY);
const dow = d => (new Date(ORIGIN+d*DAY).getUTCDay()+6)%7; // 0=Mon
const ymd = d => { const x=new Date(ORIGIN+d*DAY); return [x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate()]; };
const dayOf = (y,m,dd) => Math.round((Date.UTC(y,m,dd)-ORIGIN)/DAY);
const daysInMonth = (y,m) => new Date(Date.UTC(y,m+1,0)).getUTCDate();
function fmtNum(v,dec=0){ return v.toLocaleString('de-DE',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmtMoney(v,compact){ const a=Math.abs(v), sg=v<0?'−':'';
  if(compact){ if(a>=1e9) return sg+fmtNum(a/1e9,2)+' tỷ'; if(a>=1e6) return sg+fmtNum(a/1e6,1)+' tr'; }
  return sg+fmtNum(Math.round(a))+' đ'; }
function fmtVal(k,v,compact){ if(v===null||v===undefined||!isFinite(v)) return '—'; const m=MK[k];
  if(m.kind==='rate') return fmtNum(v*100,1)+'%';
  if(m.unit==='đ') return fmtMoney(v,compact);
  if(k==='moh') return fmtNum(v,1);
  return fmtNum(v,m.dec||0); }
// ---------- aggregation ----------
function agg(stores, d0, d1){
  const a={net:0,gross:0,ck:0,units:0,top:0,shoes:0,mapped:0,fullp:0,bills:0,traffic:0,billsT:0,tDays:0,sDays:0,days:Math.max(0,d1-d0+1)};
  if(d1<d0) return a;
  for(const s of stores){ const b=s*nD;
    for(let d=d0; d<=d1; d++){ const o=b+d; for(let i=0;i<F.length;i++) a[F[i]]+=cube[i][o];
      if(hasT[o]){ a.traffic+=traf[o]; a.billsT+=cube[8][o]; a.tDays++; } a.sDays++; } }
  // stock: mean over sample dates in [d0,d1] of sum over stores; fallback = latest sample <= d1
  let js=[]; for(let j=0;j<stockDays.length;j++) if(stockDays[j]>=d0 && stockDays[j]<=d1) js.push(j);
  a.stockFallback=false;
  if(!js.length){ let jj=-1; for(let j=0;j<stockDays.length;j++) if(stockDays[j]<=d1) jj=j; if(jj>=0){ js=[jj]; a.stockFallback=true; } }
  a.stockN=js.length; a.stockDates=js.map(j=>stockDays[j]);
  let tot=0; for(const j of js){ for(const s of stores) tot+=stockV[j][s]; }
  a.stock = js.length? tot/js.length : null;
  return a;
}
function val(k,a){
  const D=(n,d)=>d? n/d : null;
  switch(k){
    case 'net': return a.net; case 'bills': return a.bills; case 'traffic': return a.tDays? a.traffic : null;
    case 'atv': return D(a.net,a.bills); case 'upt': return D(a.units,a.bills);
    case 'ckr': return D(a.ck,a.gross); case 'cr': return D(a.billsT,a.traffic);
    case 'top': return D(a.top,a.mapped); case 'shoes': return D(a.shoes,a.mapped); case 'full': return D(a.fullp,a.net);
    case 'stock': return a.stock;
    case 'moh': return (a.stock!==null && a.days && a.net>0)? a.stock/(a.net/a.days*30) : null;
  }
}

const st = { groups:new Set(GROUPS.map(g=>g[0])), stores:new Set(S.map((_,i)=>i)), metrics:[...DEFAULT_METRICS],
  preset:'mtd', d0:null, d1:null, cmp:'auto', dim1:'group', dim2:'store', m1:'', m2:'', cl:false, clA:new Set(), clB:new Set() };
function selStores(){ return S.map((_,i)=>i).filter(i=>st.groups.has(S[i].group) && st.stores.has(i)); }
function period(){
  const L=LAST, [y,m,d]=ymd(L); let d0,d1=L;
  switch(st.preset){
    case 'mtd': d0=dayOf(y,m,1); break;
    case 'last7': d0=L-6; break;
    case 'lastweek': { const e=L-dow(L)-1; d1=(dow(L)===6)?L:e; d0=d1-6; break; }
    case 'last4w': { d1=(dow(L)===6)?L:L-dow(L)-1; d0=d1-27; break; }
    case 'lastmonth': d0=dayOf(y,m-1,1); d1=dayOf(y,m,0); break;
    case 'last90': d0=L-89; break;
    case 'qtd': d0=dayOf(y,m-m%3,1); break;
    case 'ytd': d0=0; break;
    case 'custom': d0=st.d0??0; d1=st.d1??L; break;
  }
  d0=Math.max(0,d0); d1=Math.min(L,d1); if(d1<d0) d1=d0;
  return [d0,d1];
}
function cmpPeriod(d0,d1){
  let mode=st.cmp; if(mode==='auto') mode = st.preset==='mtd'? 'prevmonth' : 'prev';
  if(mode==='none') return null;
  let c0,c1;
  if(mode==='prev'){ const n=d1-d0+1; c1=d0-1; c0=d0-n; }
  else { const [y0,m0,dd0]=ymd(d0), [y1,m1,dd1]=ymd(d1);
    c0=dayOf(y0,m0-1,Math.min(dd0,daysInMonth(y0,m0-1)));
    const mm=(y1*12+m1)-1; c1=dayOf(Math.floor(mm/12),mm%12,Math.min(dd1,daysInMonth(Math.floor(mm/12),mm%12))); }
  if(c0<0) return {missing:true,c0,c1,mode};
  return {c0,c1,mode};
}

function pct(a,b){ return (a===null||b===null||!isFinite(a)||!isFinite(b)||b===0)? null : (a-b)/Math.abs(b); }
function renderCards(stores,d0,d1,c){
  const box=document.getElementById('cards'); box.innerHTML='';

  const a=agg(stores,d0,d1), b=(c&&!c.missing)? agg(stores,c.c0,c.c1):null;

      else if(m.kind==='add' && perDay){ const x=v===null?null:v/n, y=vb===null?null:vb/nb, p=pct(x,y);

          `<div class="compare ${m.kind==='add'?'additive ':''}${p>0.0005?'up':p<-0.0005?'down':'flat'}">${p>=0?'+':'−'}${fmtNum(Math.abs(p)*100,1)}% <span class="muted">so với ${fmtVal(k,vb,true)}</span></div>`; } }
    html+=cmpTxt;

}

function buckets(kind,d0,d1){ const out=[];
  if(kind==='week'){ let s=d0; while(s<=d1){ const e=Math.min(d1, s+(6-dow(s))); out.push({k:'w'+s,l:`Tuần ${dm(s)}–${dm(e)}`,d0:s,d1:e}); s=e+1; } }
  else { let s=d0; while(s<=d1){ const [y,m]=ymd(s); const e=Math.min(d1, dayOf(y,m+1,0)); out.push({k:'m'+s,l:`Tháng ${String(m+1).padStart(2,'0')}/${y}`,d0:s,d1:e}); s=e+1; } }
  return out; }
function rowsFor(dim,stores,d0,d1){
  if(dim==='group') return GROUPS.filter(g=>stores.some(i=>S[i].group===g[0])).map(g=>({k:g[0],l:g[1],stores:stores.filter(i=>S[i].group===g[0]),d0,d1}));
  if(dim==='store') return stores.map(i=>({k:S[i].code,l:`${S[i].code} · ${S[i].name}`,stores:[i],d0,d1}));
  return buckets(dim,d0,d1).map(b=>({...b,stores}));
}
// ---------- table ----------
const WARN={cr:'Ngoài 0–100%: số bill lớn hơn lượt Palexy (camera đếm thiếu)', ckr:'Ngoài 0–100%: hàng trả lại có CK nhiều hơn hàng bán trong kỳ', full:'Ngoài 0–100%: trả hàng giảm giá làm doanh số các dòng CK ≠ 0 âm', x:'Ngoài 0–100% do trả hàng trong kỳ'};
const outRange=(k,v)=>MK[k].kind==='rate' && v!==null && (v<0||v>1);
const DIML={group:'Nhóm CH',store:'Cửa hàng',week:'Tuần',month:'Tháng'};
function renderDim2(){ const s=document.getElementById('dim2'); const cur=st.dim2;
  let opts=['none',...Object.keys(DIML).filter(k=>k!==st.dim1)];
  if(st.dim1==='store') opts=opts.filter(k=>k!=='group'); if(st.dim1==='week') opts=opts.filter(k=>k!=='month'); if(st.dim1==='month') opts=opts.filter(k=>k!=='week'||true);
  s.innerHTML=opts.map(k=>`<option value="${k}">${k==='none'?'Không lồng':DIML[k]}</option>`).join('');
  st.dim2 = opts.includes(cur)? cur : 'none'; s.value=st.dim2; }
function renderTable(stores,d0,d1){
  const box=document.getElementById('table-box');
  if(!stores.length || !st.metrics.length){ box.innerHTML=`<div class="empty">${!stores.length?'Chưa chọn cửa hàng nào.':'Chọn ít nhất một chỉ số.'}</div>`; return; }
  const ms=st.metrics; const n=d1-d0+1;
  let h=`<table><thead><tr><th>${DIML[st.dim1]}${st.dim2!=='none'?' / '+DIML[st.dim2]:''}</th>${ms.map(k=>`<th>${MK[k].l}${k==='moh'&&n<90?'*':''}</th>`).join('')}</tr></thead><tbody>`;
  const cell=(k,a,cls)=>{ const v=val(k,a); const bad=outRange(k,v);
    return `<td data-m="${k}" data-v="${v===null?'':v}"${bad?` data-flag="out" title="${WARN[k]||WARN.x}"`:''}${k==='cr'?` data-num="${a.billsT}" data-den="${a.traffic}"`:''}>${fmtVal(k,v,true)}${bad?' ⚠':''}</td>`; };
  for(const r of rowsFor(st.dim1,stores,d0,d1)){ const a=agg(r.stores,r.d0,r.d1);
    h+=`<tr class="${st.dim2!=='none'?'l1':'l0'}" data-key="${r.k}">`+`<td>${r.l}</td>`+ms.map(k=>cell(k,a)).join('')+'</tr>';
    if(st.dim2!=='none') for(const c of rowsFor(st.dim2,r.stores,r.d0,r.d1)){ const b=agg(c.stores,c.d0,c.d1);
      h+=`<tr class="l2" data-parent="${r.k}" data-key="${c.k}"><td>${c.l}</td>`+ms.map(k=>cell(k,b)).join('')+'</tr>'; } }
  const t=agg(stores,d0,d1);
  h+=`<tr class="total"><td>Tổng</td>`+ms.map(k=>cell(k,t)).join('')+'</tr></tbody></table>';
  box.innerHTML=h;
}
// ---------- chart ----------
const COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
function renderPickers(){ for(const id of ['m1','m2']){ const s=document.getElementById(id); const cur=st[id];
    s.innerHTML=`<option value="">${id==='m1'?'— Chọn chỉ số 1 —':'— Không —'}</option>`+st.metrics.filter(k=>id==='m1'||k!==st.m1).map(k=>`<option value="${k}">${MK[k].l}</option>`).join('');
    st[id]= st.metrics.includes(cur)&&!(id==='m2'&&cur===st.m1)? cur : ''; s.value=st[id]; } }
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const f of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(f*p>=v) return f*p; return 10*p; }
function renderChart(stores,d0,d1){
  const box=document.getElementById('chart'), leg=document.getElementById('legend'), sum=document.getElementById('chart-sum');
  leg.innerHTML=''; sum.textContent='';
  if(!st.m1){ box.innerHTML='<div class="hint">Chọn <b>Chỉ số 1</b> (bắt buộc) và tùy chọn Chỉ số 2 từ các chỉ số đang chọn để vẽ biểu đồ.</div>'; return; }
  const n=d1-d0+1, kind = n>92? 'month':'week'; const bs=buckets(kind,d0,d1);
  let series=[];
  const sets = st.cl? [['Cụm A',[...st.clA].filter(i=>stores.includes(i))],['Cụm B',[...st.clB].filter(i=>stores.includes(i))]] : [['Cửa hàng đang lọc',stores]];
  if(st.cl && sets.some(s=>!s[1].length)){ box.innerHTML='<div class="hint">Chọn cửa hàng cho cả Cụm A và Cụm B (trong số cửa hàng đang lọc).</div>'; return; }
  if(!stores.length){ box.innerHTML='<div class="hint">Chưa chọn cửa hàng nào.</div>'; return; }
  const ms=[st.m1, st.m2].filter(Boolean);
  ms.forEach((k,mi)=>sets.forEach(([nm,ss],si)=>{ series.push({k,mi,nm,ss,color:COLORS[mi*2+si], pts:bs.map(b=>{ const a=agg(ss,b.d0,b.d1); return {v:val(k,a),a}; })}); }));
  const W=Math.max(640, bs.length*(st.cl?44:30)+120), H=320, L=78, R=st.m2?70:20, T=16, B=50, iw=W-L-R, ih=H-T-B;
  const maxOf=mi=>niceMax(Math.max(0,...series.filter(s=>s.mi===mi).flatMap(s=>s.pts.map(p=>p.v||0))));
  const y1max=maxOf(0), y2max=st.m2? maxOf(1):1;
  const sy=(v,mx)=>T+ih-(v/mx)*ih;
  let g=`<svg id="trend" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ xu hướng">`;
  for(let i=0;i<=4;i++){ const y=T+ih*i/4; g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#ddd6cb"/>`;
    g+=`<text x="${L-6}" y="${y+4}" text-anchor="end">${fmtVal(st.m1,y1max*(1-i/4),true)}</text>`;
    if(st.m2) g+=`<text x="${W-R+6}" y="${y+4}">${fmtVal(st.m2,y2max*(1-i/4),true)}</text>`; }
  const bw=iw/bs.length; const bars=series.filter(s=>s.mi===0), lines=series.filter(s=>s.mi===1);
  const one=Math.min(26,(bw*0.75)/bars.length);
  bs.forEach((b,i)=>{ const cx=L+bw*i+bw/2;
    bars.forEach((s,si)=>{ const p=s.pts[i], v=p.v||0; const x=cx-(one*bars.length)/2+si*one, y=sy(v,y1max);
      g+=`<rect class="bar" data-m="${s.k}" data-series="${si}" data-v="${p.v===null?'':p.v}" data-num="${p.a.billsT}" data-den="${p.a.traffic}" x="${x}" y="${y}" width="${Math.max(1,one-2)}" height="${T+ih-y}" fill="${s.color}"><title>${s.nm} · ${b.l}: ${fmtVal(s.k,p.v)}</title></rect>`; });
    const lab = kind==='week'? dm(b.d0) : b.l.replace('Tháng ','');
    if(bs.length<=16 || i%Math.ceil(bs.length/16)===0) g+=`<text x="${cx}" y="${H-B+16}" text-anchor="middle">${lab}</text>`; });
  lines.forEach((s,si)=>{ const pts=s.pts.map((p,i)=>p.v===null?null:[L+bw*i+bw/2, sy(p.v,y2max)]);
    let d='', pen=false; pts.forEach(p=>{ if(!p){pen=false;return;} d+=(pen?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' '; pen=true; });
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
    pts.forEach((p,i)=>{ if(p) g+=`<circle class="pt" data-m="${s.k}" data-series="${si}" data-v="${s.pts[i].v}" data-num="${s.pts[i].a.billsT}" data-den="${s.pts[i].a.traffic}" cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.color}"><title>${s.nm} · ${bs[i].l}: ${fmtVal(s.k,s.pts[i].v)}</title></circle>`; }); });
  g+=`<text x="${L}" y="${H-8}">${kind==='week'?'Tuần (T2–CN, tuần lẻ ở hai đầu vẫn tính là một tuần)':'Tháng (khoảng ngày > 3 tháng)'}</text></svg>`;
  box.innerHTML=g;
  leg.innerHTML=series.map(s=>`<span><i style="background:${s.color}"></i>${MK[s.k].l}${s.mi===0?' (cột)':' (đường)'}${st.cl?' · '+s.nm:''}</span>`).join('');
  sum.innerHTML = 'Toàn kỳ: ' + sets.map(([nm,ss])=>{ const a=agg(ss,d0,d1); return (st.cl?nm+': ':'')+ms.map(k=>`<span class="csum" data-m="${k}" data-v="${val(k,a)??''}">${MK[k].l} ${fmtVal(k,val(k,a),true)}</span>`).join(', '); }).join(' · ');
}
function renderClusters(stores){ document.getElementById('clusters').classList.toggle('on',st.cl);
  for(const [id,set] of [['clA',st.clA],['clB',st.clB]]){ for(const i of [...set]) if(!stores.includes(i)) set.delete(i);
    storeList(id+'-pop',set,()=>{ render(); document.getElementById('ms-'+id).classList.add('open'); },stores);
    document.getElementById(id+'-btn').textContent = set.size? [...set].map(i=>S[i].code).join(', ') : 'Chọn cửa hàng'; } }
// ---------- main render ----------
function render(){
  const stores=selStores(); storesBtn(); renderMetricsPop();
  const [d0,d1]=period(); const c=cmpPeriod(d0,d1);
  document.getElementById('custom').hidden = st.preset!=='custom';
  document.getElementById('d0').value=iso(d0); document.getElementById('d1').value=iso(d1);
  const n=d1-d0+1;
  document.getElementById('cmpline').textContent = `Kỳ: ${dmy(d0)} – ${dmy(d1)} (${n} ngày)` + (c? (c.missing? ' · kỳ so sánh trước 01/01/2026, không có dữ liệu' : ` · so với ${dmy(c.c0)} – ${dmy(c.c1)} (${c.c1-c.c0+1} ngày${c.c1-c.c0+1!==n?', so theo /ngày':''})`) : '');
  renderCards(stores,d0,d1,c); renderTable(stores,d0,d1); renderPickers(); renderClusters(stores); renderChart(stores,d0,d1);
}
document.getElementById('preset').addEventListener('change',e=>{ if(e.target.value==='custom'){ const [a,b]=period(); st.d0=a; st.d1=b; } st.preset=e.target.value; render(); });
document.getElementById('cmp').addEventListener('change',e=>{ st.cmp=e.target.value; render(); });
for(const id of ['d0','d1']) document.getElementById(id).addEventListener('change',e=>{ const v=fromIso(e.target.value); if(isFinite(v)) st[id]=v; if(st.d0>st.d1) [st.d0,st.d1]=[st.d1,st.d0]; render(); });
document.getElementById('dim1').addEventListener('change',e=>{ st.dim1=e.target.value; renderDim2(); render(); });
document.getElementById('dim2').addEventListener('change',e=>{ st.dim2=e.target.value; render(); });
document.getElementById('m1').addEventListener('change',e=>{ st.m1=e.target.value; render(); });
document.getElementById('m2').addEventListener('change',e=>{ st.m2=e.target.value; render(); });
document.getElementById('cl-toggle').addEventListener('change',e=>{ st.cl=e.target.checked;
  if(st.cl && (!st.clA.size || !st.clB.size)){ st.clA.clear(); st.clB.clear(); const ss=selStores(); ss.forEach(i=>{ if(S[i].group==='ADI') st.clA.add(i); else st.clB.add(i); });
    if(!st.clB.size || !st.clA.size){ st.clA.clear(); st.clB.clear(); ss.forEach((i,j)=>(j<ss.length/2?st.clA:st.clB).add(i)); } }
  render(); });
document.getElementById('d0').min=document.getElementById('d1').min=iso(0); document.getElementById('d0').max=document.getElementById('d1').max=iso(LAST);
document.getElementById('fresh').textContent = `Dữ liệu ${dmy(0)} – ${dmy(LAST)} · ${S.length} cửa hàng · dựng ${P.built}`;
document.getElementById('notes').innerHTML = P.notes.map(x=>`<li>${x}</li>`).join('');
renderGroups(); renderStoresPop(); renderDim2(); render();
window.__S2 = {st, agg, val, selStores, period, cmpPeriod, render, S, M, LAST};
</script>
